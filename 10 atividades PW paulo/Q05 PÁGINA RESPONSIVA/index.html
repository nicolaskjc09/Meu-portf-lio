<!DOCTYPE html>
<html lang="pt-br">

<head>

    <!-- Configurações da página -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Responsiva</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Cabeçalho da página -->
    <header>
        <h1>Meu Site</h1>
    </header>

    <!-- Menu de navegação -->
    <nav>
        <a href="#">Início</a>
        <a href="#">Sobre</a>
        <a href="#">Contato</a>
    </nav>

    <!-- Conteúdo principal da página -->
    <main>

        <!-- Seção principal -->
        <section class="conteudo">

            <h2>Seção Principal</h2>

            <p>
                Aqui fica o conteúdo principal da página.
            </p>

        </section>

        <!-- Barra lateral com informações extras -->
        <aside class="lateral">

            <h2>Barra Lateral</h2>

            <p>
                Aqui ficam informações extras.
            </p>

        </aside>

    </main>

    <!-- Rodapé da página -->
    <footer>

        <p>Sistema de Página Responsiva</p>

    </footer>

</body>

</html>
